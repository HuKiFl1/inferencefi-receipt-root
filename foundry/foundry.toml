[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["../vendor/flop-receipt-root/lib"]
remappings = [
  "forge-std/=../vendor/flop-receipt-root/lib/forge-std/src/",
  "flop-receipt-root/=../vendor/flop-receipt-root/contracts/src/",
]
allow_paths = ["../vendor"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
gas_limit = "18446744073709551615"
memory_limit = 1073741824
fs_permissions = [{ access = "read", path = "../vectors" }, { access = "read", path = "../vendor/flop-receipt-root/test/fixtures" }]

[profile.default.fuzz]
runs = 256
